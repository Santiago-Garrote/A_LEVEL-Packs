# Publish the assets of the "packs" release (index.json + *.zip) to GitHub Pages.
name: Deploy packs to Pages

on:
  # run from main (Pages only deploys from the default branch): `nix run .#publish` triggers it
  # after uploading the release assets, or start it by hand from the Actions tab
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the packs release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          gh release download packs --repo "$GITHUB_REPOSITORY" --dir site
          touch site/.nojekyll
          ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
